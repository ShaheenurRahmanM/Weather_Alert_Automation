name: Rain Alert (15 min ahead)

# Runs every 15 min. Scheduled runs can be delayed under load, so the script
# looks 30 min ahead (configurable) to still warn you in time.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: rain-alert
  cancel-in-progress: false

jobs:
  check-rain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Persist anti-spam state between runs via the Actions cache.
      - name: Restore rain state
        uses: actions/cache/restore@v4
        with:
          path: rain_state.json
          key: rain-state-${{ github.run_id }}
          restore-keys: |
            rain-state-

      - name: Check for upcoming rain
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RAIN_STATE_FILE: "rain_state.json"
        run: python rain_alert.py

      - name: Save rain state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: rain_state.json
          key: rain-state-${{ github.run_id }}
